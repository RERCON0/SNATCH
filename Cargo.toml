[package]
name = "snatch-rs"
version = "0.5.0"
edition = "2021"
build = "build.rs"
description = "SNATCH — native GUI download app (yt-dlp + aria2c) for the terminal-shy"
license = "GPL-3.0-or-later"

[lib]
name = "snatch_rs"
path = "src/lib.rs"

[[bin]]
name = "snatch-app"
path = "src/bin/snatch-app.rs"

[[bin]]
name = "snatch"
path = "src/bin/snatch-cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
fs4 = "1.1"
# eframe already pulls this in transitively to decode its own icons/textures
# (see Cargo.lock) - declaring it directly just lets our own code call it too,
# for cropping/resizing the bundled app icon into egui::IconData.
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.17"
inquire = "0.9"
# default-features off: drops the HTTP/2 stack (h2); charset/encoding_rs is not
# needed either - every endpoint we call is UTF-8 (JSON API, XML with
# encoding="utf-8", ASCII sums), and .text() keeps decoding UTF-8 via
# from_utf8_lossy. default-tls uses schannel on Windows; system-proxy keeps
# corporate-proxy support.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
# Already in the tree via inquire/indicatif (see Cargo.lock): the CLI torrent
# picker clips rows by terminal cells, where CJK takes two.
unicode-width = "0.2"
zip ={ version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# Already present transitively; nonblocking opens keep planted FIFOs from
# hanging config/lock reads before their file type can be checked.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# opt-level="z" keeps the exe small, but epaint is this app's hot path -
# per-frame text layout/tessellation (the log window alone re-lays out ~500
# lines whenever its text changes) is float-heavy and measurably stutters
# when size-optimized. Speed up just that crate; everything else stays "z".
[profile.release.package.epaint]
opt-level = 2

# Same story one layer up: egui's per-frame widget layout, interaction and id
# hashing run on the very same frame path as epaint's tessellation.
[profile.release.package.egui]
opt-level = 2
