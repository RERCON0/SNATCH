[package]
name = "snatch-rs"
version = "0.3.1"
edition = "2021"
description = "SNATCH — native GUI download app (yt-dlp + aria2c) for the terminal-shy"
license = "GPL-3.0-or-later"

[lib]
name = "snatch_rs"
path = "src/lib.rs"

[[bin]]
name = "snatch-app"
path = "src/bin/snatch-app.rs"

[[bin]]
name = "snatch"
path = "src/bin/snatch-cli.rs"

# Python's pyproject.toml installed this as a second command alias for the
# same entry point ([project.scripts] down = "snatch.cli:main") - kept so
# muscle-memory / scripts invoking `down` still work after dropping Python.
[[bin]]
name = "down"
path = "src/bin/snatch-cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
# eframe already pulls this in transitively to decode its own icons/textures
# (see Cargo.lock) - declaring it directly just lets our own code call it too,
# for cropping/resizing the bundled app icon into egui::IconData.
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.17"
inquire = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
