[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snatch"
description = "Interactive yt-dlp + aria2c download companion for the terminal"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = ["questionary>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[project.scripts]
snatch = "snatch.cli:main"
down = "snatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "snatch.__version__" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
