[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "downcli"
version = "0.1.1"
description = "Interactive yt-dlp + aria2c download companion for the terminal"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["questionary>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
snatch = "downcli.cli:main"
down = "downcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
